name: Latest blog posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Pull latest DWAO blog posts into README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README from sitemap
        run: node .github/scripts/update-blog-posts.mjs

      - name: Commit changes
        run: |
          if [[ -z "$(git status --porcelain profile/README.md)" ]]; then
            echo "No README changes — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore(readme): refresh latest DWAO blog posts"
          git push
